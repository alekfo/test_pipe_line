name: CI Pipeline

on:
  pull_request:
    branches: [ origin ]
  push:
    branches: [ origin ]

jobs:
  black-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v3
      with:
        python-version: '3.10'
    - run: pip install black
    - run: black --check src/ tests/
  
  isort-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v3
      with:
        python-version: '3.10'
    - run: pip install isort
    - run: isort --check-only src/ tests/
  
  mypy-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v3
      with:
        python-version: '3.10'
    - run: pip install mypy
    - run: mypy src/
  
  pytest-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v3
      with:
        python-version: '3.10'
    - run: pip install pytest
    - run: pytest tests/
